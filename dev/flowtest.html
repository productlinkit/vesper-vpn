<!doctype html><html><head><meta charset="utf-8"></head><body>
<pre id="o">running</pre>
<iframe id="f" style="width:390px;height:844px"></iframe>
<script>
const r=[];const wait=t=>new Promise(x=>setTimeout(x,t));
let W,D;
const S=()=>W.eval('S');
const click=sel=>{const e=D.querySelector(sel);if(!e)throw new Error('missing '+sel);e.click()};
const act=(a,arg)=>click(arg!=null?`[data-act="${a}"][data-arg="${arg}"]`:`[data-act="${a}"]`);
const type=(id,v)=>{const i=D.getElementById(id);i.value=v;i.dispatchEvent(new W.Event('input',{bubbles:true}))};
const ok=(name,cond)=>r.push((cond?'PASS ':'FAIL ')+name);
async function load(clear){if(clear)localStorage.clear();f.src='/index.html?'+Math.random();await new Promise(x=>f.onload=x);W=f.contentWindow;D=f.contentDocument}
async function run(){
 await load(true);
 ok('opens on splash (screen at load: '+S().screen+')',S().screen==='splash');
 await wait(3200);ok('splash → onboarding',S().screen==='onboard');
 ok('onboarding: 3 photo slides',D.querySelectorAll('.obslide img').length===3&&D.querySelectorAll('.obpill').length===6);
 act('obGo','2');ok('dot → slide 3',S().ob===2&&D.getElementById('obtrack').style.transform.includes('200'));
 await wait(4700);ok('carousel auto-advances',S().ob===0);
 act('toSignup');ok('Get Started → Create Account',S().screen==='signup');
 type('su-email','bad');act('signup');ok('invalid field gets aria-invalid',D.getElementById('su-email').getAttribute('aria-invalid')==='true');ok('signup validation errors only after submit',D.getElementById('e-su-email').textContent!==''&&D.getElementById('e-su-pw').textContent!=='');
 type('su-email','new@user.com');type('su-pw','Secret123!');type('su-pw2','Secret123!');act('agree');act('signup');
 ok('→ Email Verification',S().screen==='verify');act('go','otp');ok('→ OTP',S().screen==='otp');
 const ins=D.querySelectorAll('#otp input');ins[0].value='1';ins[1].value='2';act('otp');ok('incomplete OTP shows error',!!D.querySelector('.otp.err')&&D.body.textContent.includes('Enter your correct OTP'));
 D.querySelectorAll('#otp input').forEach((i,k)=>i.value=String(k+1));act('otp');
 ok('OTP → Home (free) + Account Created sheet',S().screen==='home'&&S().user==='free'&&S().ov==='created');
 ok('checklist button on Home (1/5)',!!D.querySelector('.setupbtn')&&D.querySelector('.setupbtn').textContent.includes('1/5'));
 act('close');ok('coach mark "Tap this button" (step 1 of 4, spotlight)',D.body.textContent.includes('Tap this button')&&D.querySelector('#coach .cstep').textContent==='Step 1 of 4'&&!!D.getElementById('spot'));
 act('tourNext');ok('tour step 2: choose free country',D.querySelector('#coach .ctitle').textContent==='Tap to choose your free country');
 act('tourNext');act('tourNext');ok('tour step 4: Menu',D.querySelector('#coach .ctitle').textContent==='Menu');
 act('tourNext');ok('tour Done → checklist sheet',S().ov==='setup'&&!D.getElementById('coach'));
 act('close');
 act('connect');ok('VPN permission prompt',S().ov==='perm');act('allow');ok('Connecting state',S().vpn==='connecting'&&D.body.textContent.includes('Connecting'));
 await wait(2000);ok('Connected + timer + data pill',S().vpn==='on'&&D.getElementById('timer')&&D.body.textContent.includes('MB left today'));
 act('disconnect');ok('Disconnect → free trial sheet',S().vpn==='off'&&S().ov==='trial');act('close');
 act('tab','servers');ok('Server List loading skeleton',!!D.querySelector('.skel'));await wait(1000);
 ok('free: locked PRO servers',D.body.textContent.includes('PRO')&&D.body.textContent.includes('Premium countries'));
 act('exp','be');act('pick','be|Brussels');ok('pick server → Home shows it',S().screen==='home'&&D.body.textContent.includes('Belgium'));
 act('tab','servers');
 ok('locked PRO servers have no heart',!D.querySelector('[data-act="fav"][data-arg="jp"]'));
 act('fav','at');ok('tap heart → Austria favorited',W.eval("isFav('at')")&&D.querySelector('[data-act="fav"][data-arg="at"]').getAttribute('aria-pressed')==='true');
 ok('Favorites section appears at top of Server List',D.body.textContent.includes('Favorites'));
 ok('screen reader announcement',D.getElementById('live').textContent.includes('added to favorites'));
 act('tab','home');ok('favorite shows first in Quick Connect with heart',D.querySelector('.qcc').textContent.includes('Austria')&&!!D.querySelector('.qcc .qb'));
 act('tab','servers');act('fav','at');ok('tap heart again → removed',!W.eval("isFav('at')"));
 act('fav','at');act('tab','home');
 const small=[...D.querySelectorAll('.ph button,.ph a,.ph [data-act]')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&(r.width<24||r.height<24)}).map(e=>e.getAttribute('aria-label')||e.textContent.trim().slice(0,15));
 ok('touch targets ≥24px on Home (WCAG 2.5.8) '+(small.length?'['+small.join(',')+']':''),small.length===0);
 act('tab','servers');act('locked','jp');ok('locked server → Choose Your Plan',S().screen==='plans');
 ok('plan CTA disabled until selection',D.querySelector('[data-act="planGo"]').disabled);
 act('plan','month');ok('plan selected expands features',D.body.textContent.includes('2 simultaneous devices')&&D.body.textContent.includes('Get 1-Month Plan'));
 act('planGo');ok('→ Checkout',S().screen==='checkout');
 type('co-name','');act('pay');ok('→ Processing',S().screen==='processing');await wait(2200);ok('empty name → Payment Failed',S().screen==='payfail');
 act('back');await wait(200);ok('Try Again → Checkout',S().screen==='checkout');
 type('co-name','Alex Johnson');act('pay');await wait(2200);ok('→ Welcome to Premium',S().screen==='welcome');
 act('startPremium');ok('Home Premium (PREMIUM badge)',S().user==='premium'&&D.body.textContent.includes('PREMIUM'));
 act('tab','servers');ok('premium: no locked servers',D.querySelectorAll('.pro').length===0&&D.querySelectorAll('.srow').length>10);
 act('tab','menu');act('go','subscription');ok('Menu → My Subscription (active)',S().screen==='subscription'&&D.body.textContent.includes('ACTIVE'));
 act('go','cancelReason');act('go','cancelSure');act('doCancel');ok('cancel flow → Subscription Cancelled sheet',S().ov==='cancelled');
 act('tab','subscription');ok('subscription shows CANCELLED + Reactivate',D.body.textContent.includes('CANCELLED')&&D.body.textContent.includes('Reactivate'));
 act('tab','menu');act('go','account');act('go','changePw');
 type('cp-cur','wrong');act('changePw');ok('change password: wrong current shows error',D.body.textContent.includes('Incorrect current password'));
 W.history.back();await wait(300);ok('browser Back → Account',S().screen==='account');
 W.history.back();await wait(300);ok('browser Back → Menu',S().screen==='menu');
 act('go','settings');act('go','split');W.history.back();await wait(300);ok('Back from Split Tunneling shows its info box',S().screen==='settings'&&D.body.textContent.includes('Choose which apps use the VPN'));
 await load(false);ok('refresh keeps same screen',S().screen==='settings');
 W.eval("A.tab('menu')");D=f.contentDocument;
 act('ov','signout');act('signout');ok('Sign Out → Sign In',S().screen==='signin'&&!S().user);
 type('si-email','new@user.com');type('si-pw','nope1234');act('signin');ok('wrong password → Authentication failed',D.body.textContent.includes('Authentication failed'));
 type('si-email','new@user.com');type('si-pw','Secret123!');act('signin');ok('Sign In → OTP',S().screen==='otp');
 D.querySelectorAll('#otp input').forEach((i,k)=>i.value=String(k+1));act('otp');ok('→ Home + Welcome Back (still premium)',S().screen==='home'&&S().ov==='welcomeBack'&&S().user==='premium');
 act('close');act('tab','menu');act('ov','signout');act('signout');
 act('go','forgot');type('fp-email','new@user.com');act('forgot');ok('Forgot → Check Your Email',S().screen==='checkEmail');
 act('go','otp');D.querySelectorAll('#otp input').forEach((i,k)=>i.value=String(k+1));act('otp');ok('→ Set New Password',S().screen==='setPw');
 type('np-pw','Another123');type('np-pw2','Another123');act('setPw');ok('→ Sign In',S().screen==='signin');
 act('ov','guest');ok('Continue as Guest? sheet',S().ov==='guest');act('asGuest');ok('Home Guest bar',D.body.textContent.includes('Browsing as Guest'));
 act('guestTip');ok('guest tooltip 500 MB',D.body.textContent.includes('Guests receive 500 MB'));
 W.eval("S.data=5;S.perm=true;VPN.connect()");await wait(2000);await wait(1100);ok('guest limit reached → limit sheet',S().ov==='limit'&&D.body.textContent.includes('500 MB of free data'));
 act('upgrade');ok('guest upgrade → Sign In to Continue',S().ov==='signinContinue');
 W.eval("go('account')");ok('guard: guest cannot open Account (→ Home)',S().screen==='home');
 ok('guest profile is separate (no premium leak)',S().user==='guest'&&W.eval('S.plan')===null&&!W.eval('S.qc').some(q=>q.b));
 W.eval("S.ov=null;A.toSignin()");type('si-email','new@user.com');type('si-pw','Another123');act('signin');D.querySelectorAll('#otp input').forEach((i,k)=>i.value=String(k+1));act('otp');
 ok('account keeps its own Premium plan after guest session',S().user==='premium'&&W.eval('S.plan')==='month');
 W.eval("S.ov=null;S.perm=true;VPN.connect()");await wait(2000);ok('VPN state machine: connected',S().vpn==='on');
 W.eval("A.tab('menu')");act('ov','signout');act('signout');ok('sign out resets VPN to off',S().vpn==='off'&&!S().session);
 await load(false);ok('refresh on Sign In stays on Sign In',S().screen==='signin');
 W.eval("A.asGuest();A.tab('menu')");
 ok('Menu uses card layout with icon tiles',D.querySelectorAll('.mcard').length>=2&&D.querySelectorAll('.mrow .mtile').length>=5);
 act('go','support');act('go','emailSupport');act('sendEmail');ok('Email Support: validation',D.getElementById('e-es-msg').textContent!==''&&D.getElementById('e-topic').textContent!=='');
 type('es-email','me@test.com');act('topic','Billing');D.getElementById('es-msg').value='I was charged twice this month.';act('sendEmail');
 ok('Email Support: message sent state',D.body.textContent.includes('Message sent')&&D.body.textContent.includes('me@test.com'));
 act('supportDone');await wait(300);ok('back to Support center',S().screen==='support');
 act('go','chat');ok('Live Chat opens with greeting',D.body.textContent.includes("I'm Maya"));
 act('chatQuick',"I can't connect");ok('chat shows typing indicator',!!D.querySelector('.bubble.typing'));
 await wait(1500);ok('chat agent replies',D.querySelectorAll('.bubble').length>=3&&D.body.textContent.includes('protocol'));
 W.history.back();await wait(300);act('go','sales');act('sendSales');ok('Sales: validation',D.getElementById('e-size').textContent!=='');
 type('sl-name','Rina Putri');type('sl-email','rina@company.com');type('sl-co','Acme');act('teamSize','11–50');act('sendSales');
 ok('Sales: thanks state',D.body.textContent.includes('Thanks, Rina'));
 W.eval("goRoot('terms')");const ds=D.querySelectorAll('#pol details');ok('Terms: accordion sections (first open, others closed)',ds.length===3&&ds[0].open&&!ds[1].open);
 act('toggleAll');ok('Terms: Expand all',[...D.querySelectorAll('#pol details')].every(d=>d.open));
 W.eval("A.tab('servers')");await wait(1000);act('exp','au');ok('Server cities show location pin + latency',D.querySelectorAll('.cities .city .pin').length===3&&D.querySelector('.cities').textContent.includes('ms'));
 act('pick','au|Perth');ok('picked city shows on Home',S().screen==='home'&&D.body.textContent.includes('Perth'));
 W.eval("S.perm=true;S.data=500;VPN.connect()");ok('connecting: progress ring, radar sweep, orbit dots',!!D.querySelector('.prog-fg')&&!!D.querySelector('.sweep')&&D.querySelectorAll('.orbit').length===3);
 await wait(700);ok('connecting: status step text changes',D.getElementById('cstep').textContent==='Securing connection…');
 await wait(1300);ok('connected: burst effect',!!D.querySelector('.burst')&&S().vpn==='on');
 W.eval("startSession('user','demouser@email.com');S.accounts['demouser@email.com'].setup={account:true,connect:true,server:true,fav:true,notif:false,hidden:false};goRoot('home')");
 W.eval("A.tab('menu');go('notifications')");W.eval("A.tab('home')");ok('finishing last task → "You\'re all set!"',S().ov==='setup'&&D.body.textContent.includes("all set"));
 act('hideSetup');ok('Finish hides checklist button',!D.querySelector('.setupbtn'));
 W.eval("A.asGuest()");act('guestTip');ok('guest hint uses the same coach card',!!D.querySelector('#coach .cbtn')&&D.querySelector('#coach').textContent.includes('500 MB'));
 act('guestTip');
 const all=['splash','onboard','signup','signin','verify','otp','forgot','checkEmail','setPw','home','offline','servers','plans','checkout','processing','payfail','welcome','receipt','menu','account','editProfile','changePw','pwUpdated','deleted','subscription','cancelReason','cancelSure','settings','split','notifications','protocol','about','support','terms','update','suspended','emailSupport','chat','sales'];
 ok('all screens defined ('+all.length+')',all.every(s=>W.eval('typeof SC["'+s+'"]')==='function'));
 o.textContent='RESULT\n'+r.join('\n');
}
run().catch(e=>{o.textContent='RESULT\n'+r.join('\n')+'\nERROR '+e.message});
</script></body></html>
