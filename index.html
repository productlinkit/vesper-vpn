<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1A4D">
<title>VesperVPN</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vesper.css">
<style>
/* ---------- app shell ---------- */
html,body{height:100%;overflow-x:hidden}
body{margin:0;background:#ECEFF4}
#app{position:relative;max-width:430px;margin:0 auto;height:100dvh}
.ph{width:100%!important;height:100dvh!important;border-radius:0!important;box-shadow:0 0 0 1px rgba(15,23,42,.06)!important;user-select:none;-webkit-tap-highlight-color:transparent}
@media (max-width:430px){body{background:#fff}.ph{box-shadow:none!important}}
.sb{display:none!important}
.top-safe{height:max(16px,env(safe-area-inset-top));flex:none}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer}
a,[data-act]{cursor:pointer}
.row>.btn{flex:1 1 0;width:auto;min-width:0}
/* inputs */
.inp input,.inp textarea{flex:1;border:0;outline:0;background:transparent;font:inherit;color:inherit;min-width:0;padding:0}
.inp input::placeholder,.inp textarea::placeholder{color:var(--faint)}
.inp:focus-within{border-color:var(--blue)}
.inp.err:focus-within{border-color:#E5484D}
.eye{border:0;background:none;padding:4px;color:var(--faint);display:flex}
.inp.err .eye{color:var(--err)}
.btn:disabled{background:#EEF1F6;color:#8A94A6;box-shadow:none;cursor:not-allowed}
.errt:empty{display:none}
.otp input{width:62px;height:62px;border-radius:16px;border:1.5px solid #8C8C8C;text-align:center;font:500 26px 'Plus Jakarta Sans',sans-serif;outline:0;color:var(--ink);background:#fff}
.otp input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.25)}
.otp.err input{border-color:#E5484D;background:var(--err-bg)}
/* home: responsive, light like the design */
.hero{top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column}
.hero.g{top:48px}
.hero.on{background:linear-gradient(165deg,#E5E2F4 0%,#EEEDF6 55%,#E7E4F3 100%);border-color:#DCD8EF}
.hero.on .stat{color:var(--ink2)!important}
.hero.on .r1{background:rgba(255,255,255,.35)}.hero.on .r2{background:rgba(255,255,255,.5)}
.hero.on .pw{background:linear-gradient(180deg,#E4DDF6 0%,#C3B6EA 100%);color:#fff;box-shadow:0 20px 40px -18px rgba(91,72,160,.45);animation:none}
.hero.cn{background:linear-gradient(165deg,#E7E5F3,#EFEEF6);border-color:#DFDCEE}
.hero.cn .pw{background:linear-gradient(180deg,#E6E1F6,#C9BEEC);color:#374151}
.vis{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;min-height:200px;padding-top:30px}
.vis .ring{top:50%!important;transform:translate(-50%,-56%)}
.pw{position:relative!important;left:auto!important;top:auto!important;margin:0!important;flex:none;border:0;cursor:pointer}

.pw .i{stroke-width:2.4}
.stat{position:static!important}
.card{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;margin:8px}
@media (max-height:720px){.pw{width:128px!important;height:128px!important}.pw .i{width:50px!important;height:50px!important}.r1{width:400px!important;height:400px!important}.r2{width:260px!important;height:260px!important}}
.fastp{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #E2E8F0;background:#F6F8FB;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--mute);flex:none}
.qcc{border:0;font-family:inherit;cursor:pointer;color:var(--ink)}
.qb{position:absolute;top:6px;right:calc(50% - 30px);width:20px;height:20px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.qb .i{width:12px;height:12px;stroke-width:2.4}
/* motion */
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(-46%) scale(.96)}}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.scrim{animation:fade .25s}
.modal{animation:pop .25s ease}
.screen-in{animation:fade .18s ease}
/* ---------- accessibility layer (WCAG 2.2 AA) ---------- */
:root{--faint:#5F6B7D;--mute:#556274;--err:#C21F1F;--err-bg:#FEF3F2}
body{line-height:1.5}
.h1,.h2,.h3,.logo{line-height:1.2}
.small,.help,.errt,.li .st,.note,.feat,.plan .nm{font-size:14px}
.sec,.hist,.chip,.plan .sub{font-size:14px}
.pill,.pro,.qcc small{font-size:13px}
.premcard .stats span{font-size:14px}
.pill.gold{background:linear-gradient(135deg,#B45309,#92400E)}
.hero.fail .stat span{color:#A3191C!important;font-weight:600}
.card{gap:16px!important;padding:24px 20px 20px!important}
.plan{padding:16px 18px}.feat{gap:9px}
.eye{min-width:44px;min-height:44px;justify-content:center;align-items:center;margin-right:-10px}
.lnk,.lbl a{display:inline-block;padding:4px 2px;margin:-4px -2px}
.tog{min-width:50px;min-height:30px}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px;border-radius:8px}
.inp:focus-within{box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topalert{position:absolute;left:16px;right:16px;top:max(12px,env(safe-area-inset-top));z-index:6;background:#fff!important;border-color:#D6DEEC!important;box-shadow:0 16px 32px -16px rgba(8,15,38,.45);animation:alertDown .4s cubic-bezier(.2,.9,.3,1.15) .15s both;padding-right:6px!important;align-items:flex-start}
.alert-x{width:44px;height:44px;margin:-10px -2px -10px 0;border:0;background:none;color:var(--mute);display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
@keyframes alertDown{from{opacity:0;transform:translateY(-120%)}}
/* ---------- menu cards ---------- */
.mcard{background:#fff;border:1px solid #E6EAF2;border-radius:22px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:68px;color:var(--ink);text-decoration:none;position:relative;transition:background .15s}
.mrow+.mrow:before{content:"";position:absolute;top:0;left:70px;right:16px;height:1px;background:#EEF1F6}
.mrow:active{background:#F4F6FB}
.mtile{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.mtile.violet{background:#F1ECFF;color:#5B3CC4}.mtile.amber{background:#FFF4E5;color:#B45309}.mtile.green{background:#E8F7EF;color:#047857}.mtile.rose{background:#FFEDF0;color:var(--err)}.mtile.slate{background:#EEF1F6;color:#475569}
.mtx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.mt{font-size:16px;font-weight:600}.ms{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.mlock{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--blue);background:var(--tint);border-radius:999px;padding:4px 9px}
.mlock .i{width:13px;height:13px}
.mlabel{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin:26px 4px 10px}
.mhead{background:#fff;border:1px solid #E6EAF2;border-radius:24px;padding:18px;box-shadow:0 8px 24px -18px rgba(15,23,42,.35)}
.mhead.prem{background:radial-gradient(80% 90% at 100% 0%,#3B5BFF 0%,transparent 60%),var(--grad-deep);border:0;color:#fff}
.online{width:8px;height:8px;border-radius:50%;background:#16A34A;display:inline-block;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
/* ---------- accordion ---------- */
.acc2{border-top:1px solid #EEF1F6}.acc2:first-child{border-top:0}
.acc2 summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px;min-height:56px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
.acc2 summary::-webkit-details-marker{display:none}
.acc2 summary .i{color:var(--mute);transition:transform .25s}
.acc2[open] summary .i{transform:rotate(180deg);color:var(--blue)}
.acc2-b{padding:0 18px 18px;font-size:15px;line-height:1.7;color:var(--ink2)}
.acc2[open] .acc2-b{animation:fadeUp .3s ease}
/* ---------- server cities ---------- */
.cname{flex:1;display:flex;flex-direction:column;gap:1px}.cname small{font-size:13px;font-weight:500;color:var(--mute)}
.cities{padding:2px 0 12px 8px!important;gap:6px;animation:fadeUp .25s ease}
.city{gap:12px;padding:10px 12px!important;min-height:56px;border-radius:14px!important;background:#F5F7FB!important;margin-top:0!important}
.city.sel{background:var(--tint)!important;box-shadow:inset 0 0 0 1.5px var(--blue)}
.pin{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.cn{flex:1;display:flex;flex-direction:column;gap:1px}.cn b{font-size:15px;font-weight:600;color:var(--ink)}.cn small{font-size:13px;color:var(--mute)}
.sig3{display:flex;align-items:flex-end;gap:2px;height:14px}.sig3 i{width:4px;border-radius:1px;background:#CBD5E1}.sig3 i:nth-child(1){height:5px}.sig3 i:nth-child(2){height:9px}.sig3 i:nth-child(3){height:14px}.sig3 i.on{background:#16A34A}
/* ---------- support forms & chat ---------- */
.chipb{background:#fff;font:inherit;font-size:14px;min-height:40px;padding:8px 16px;cursor:pointer;color:var(--ink2)}
.chipb.on{background:var(--tint);border-color:var(--blue);color:var(--blue-d);font-weight:600}
.bubble{max-width:80%;padding:12px 14px;border-radius:18px 18px 18px 6px;background:#fff;border:1px solid #E6EAF2;font-size:15px;line-height:1.5;color:var(--ink);animation:fadeUp .25s ease;align-self:flex-start}
.bubble.me{align-self:flex-end;background:var(--grad);color:#fff;border:0;border-radius:18px 18px 6px 18px}
.bubble.typing{display:flex;gap:4px;padding:16px}.bubble.typing i{width:7px;height:7px;border-radius:50%;background:#94A3B8;animation:blink 1s ease-in-out infinite}.bubble.typing i:nth-child(2){animation-delay:.15s}.bubble.typing i:nth-child(3){animation-delay:.3s}
.chatbar{gap:10px;padding:12px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.sendb{width:48px;height:48px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
/* ---------- connecting: progress ring, radar sweep, orbiting dots ---------- */
.prog{position:absolute;width:212px;height:212px;left:50%;top:50%;margin:-106px 0 0 -106px;transform:rotate(-90deg);pointer-events:none}
.prog-bg{fill:none;stroke:rgba(47,107,255,.14);stroke-width:6}
.prog-fg{fill:none;stroke:url(#pg);stroke-width:6;stroke-linecap:round;stroke-dasharray:629;stroke-dashoffset:629;animation:progFill 1.8s cubic-bezier(.4,0,.2,1) forwards;filter:drop-shadow(0 0 6px rgba(47,107,255,.6))}
@keyframes progFill{to{stroke-dashoffset:0}}
.sweep{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:conic-gradient(from 0deg,rgba(47,107,255,0) 0deg,rgba(47,107,255,0) 280deg,rgba(47,107,255,.28) 350deg,rgba(47,107,255,0) 360deg);animation:spin 1.6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 82px,#000 84px,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 82px,#000 84px,#000 70%,transparent 71%);pointer-events:none}
.orbit{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;animation:spin linear infinite}
.orbit i{position:absolute;top:-5px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:#2F6BFF;box-shadow:0 0 12px 2px rgba(47,107,255,.7)}
.orbit.o1{width:250px;height:250px;margin:-125px 0 0 -125px;animation-duration:1.4s}
.orbit.o2{width:290px;height:290px;margin:-145px 0 0 -145px;animation-duration:2.1s;animation-direction:reverse}.orbit.o2 i{width:7px;height:7px;margin-left:-3.5px;background:#7FA2FF}
.orbit.o3{width:330px;height:330px;margin:-165px 0 0 -165px;animation-duration:2.8s}.orbit.o3 i{width:6px;height:6px;margin-left:-3px;background:#A78BFA}
.pwwrap.connecting .pw .i{animation:iconPulse 1s ease-in-out infinite}
@keyframes iconPulse{50%{opacity:.45;transform:scale(.92)}}
.cstat{display:flex;flex-direction:column;align-items:center;gap:2px}
.cstat small{font-size:13px;color:var(--mute);font-weight:500}
.cstat small.swap{animation:fadeUp .3s ease}
.dots i{font-style:normal;animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.burst{display:none;position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(124,96,220,.6)}
.fx-on .burst{display:block;animation:burst .8s ease-out forwards}
@keyframes burst{from{transform:scale(.9);opacity:1}to{transform:scale(2.1);opacity:0}}
/* ---------- onboarding carousel ---------- */
.obview{overflow:hidden;flex:none;touch-action:pan-y;user-select:none}
.obtrack{display:flex;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.obslide{flex:0 0 100%;display:flex;flex-direction:column;align-items:center}
.obphoto{position:relative;width:min(76%,300px);height:min(440px,50dvh);margin:22px auto 0}
.obphoto img{width:100%;height:100%;object-fit:cover;border-radius:30px;display:block;box-shadow:0 24px 48px -28px rgba(15,23,42,.5)}
.obpill{position:absolute;display:flex;align-items:center;gap:8px;background:rgba(238,242,251,.94);backdrop-filter:blur(8px);border-radius:999px;padding:9px 18px 9px 12px;font-size:16px;font-weight:500;color:var(--ink);white-space:nowrap;box-shadow:0 8px 20px -12px rgba(15,23,42,.4)}
.obpill.tl{left:-34px;top:-14px}.obpill.br{right:-40px;bottom:12px}.obpill.tr{right:-26px;top:-10px}.obpill.bl{left:-30px;bottom:18px}
.obslide .obpill{animation:pillIn .55s cubic-bezier(.2,.9,.3,1.3) .3s both,bob 4s ease-in-out 1s infinite}
.obtext{align-items:center;gap:10px;margin-top:26px}
.obdots{display:flex;justify-content:center;gap:2px;margin-top:14px}
.obdot{width:30px;height:30px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.obdot i{display:block;width:10px;height:10px;border-radius:5px;background:#9CA3AF;transition:width .3s,background .3s}
.obdot.on{width:44px}.obdot.on i{width:32px;background:var(--grad)}
/* ---------- coach marks: one shared style ---------- */
.spot{position:absolute;z-index:20;pointer-events:none;box-shadow:0 0 0 9999px rgba(8,15,38,.55),0 0 0 3px rgba(255,255,255,.9)}
.spot.light{box-shadow:0 0 0 9999px rgba(8,15,38,.18),0 0 0 3px rgba(67,97,238,.6)}
.coach{position:absolute;z-index:21;background:#fff;border-radius:20px;padding:16px 18px 14px;box-shadow:0 24px 48px -16px rgba(8,15,38,.45);display:flex;flex-direction:column;gap:4px;animation:coachIn .35s cubic-bezier(.2,.9,.3,1.2)}
.coach .carrow{position:absolute;top:-7px;width:16px;height:16px;margin-left:-8px;background:#fff;transform:rotate(45deg);border-radius:3px}
.coach.above .carrow{top:auto;bottom:-7px}
.cstep{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.ctitle{font-size:18px;font-weight:700;color:var(--ink);line-height:1.3}
.cbody{margin:0;font-size:15px;line-height:1.5;color:var(--mute)}
.cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.cbtn{border:0;background:var(--grad);color:#fff;font:inherit;font-size:15px;font-weight:600;border-radius:999px;padding:0 20px;min-height:44px;cursor:pointer}
.clink{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--mute);min-height:44px;padding:0 6px;cursor:pointer}
@keyframes coachIn{from{opacity:0;transform:translateY(8px) scale(.97)}}
/* ---------- getting-started checklist ---------- */
.setupbtn{position:absolute;top:14px;right:14px;z-index:3;width:52px;height:52px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -10px rgba(15,23,42,.4);cursor:pointer;padding:0}
.setupbtn svg{position:absolute;inset:4px}.setupbtn span{font-size:12px;font-weight:700;color:var(--blue-d)}
.setlist{display:flex;flex-direction:column;background:#F5F7FB;border-radius:20px;padding:4px 14px}
.setitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #E6EAF2}.setitem:last-child{border-bottom:0}
.setitem b{font-size:15px;font-weight:600}.setitem.done b{color:var(--mute);text-decoration:line-through}
.setchk{width:26px;height:26px;border-radius:50%;border:2px solid #B8C3D6;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.setitem.done .setchk{background:var(--grad);border-color:transparent;animation:pwOn .45s ease}
.setchk .i{width:15px;height:15px;stroke-width:2.8}
.setgo{border:1.5px solid var(--blue);background:#fff;color:var(--blue-d);font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:0 14px;min-height:36px;cursor:pointer;flex:none}
/* ---------- favorites ---------- */
.srow{display:flex;align-items:center;gap:6px;padding:0!important;border-bottom:1px solid var(--line)}
.srow-main{flex:1;display:flex;align-items:center;gap:16px;padding:16px 0;background:none;border:0;font:inherit;font-size:17px;font-weight:600;color:inherit;text-align:left;cursor:pointer;min-height:56px}
.srow-main .flag{width:44px;height:30px;border-radius:7px}
.fav,.chevb{width:44px;height:44px;border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute);cursor:pointer;flex:none}
.fav .i,.chevb .i{color:inherit!important}.fav.on{color:#E0245E}.fav.on .i{fill:#E0245E}
.fav.pop .i{animation:heartPop .45s cubic-bezier(.2,.9,.3,1.5)}
@keyframes heartPop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.srow.sk{padding:16px 0!important;gap:16px}
.srow .lockb{display:flex;align-items:center;gap:8px;padding-right:10px;color:var(--mute)}
/* ---------- splash timeline ---------- */
.sp-shield{position:relative;z-index:1;animation:spIn .55s cubic-bezier(.2,.9,.3,1.35) both,spOut .4s ease-in 2.05s forwards}
.sp-grad{opacity:0;animation:fadeTo .5s ease 1.25s forwards}
.sp-check{stroke-dasharray:90;stroke-dashoffset:90;animation:draw .45s cubic-bezier(.6,0,.2,1) .7s forwards}
.sp-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(79,107,255,.55),transparent 65%);opacity:0;animation:glow 1.3s ease 1.2s forwards}
.sp-logo{opacity:0;animation:logoIn .65s cubic-bezier(.2,.8,.2,1) 2.3s forwards}
@keyframes spIn{from{opacity:0;transform:scale(.4) rotate(-8deg)}}
@keyframes spOut{to{opacity:0;transform:scale(.55) translateY(-8px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeTo{to{opacity:1}}
@keyframes glow{0%{opacity:0;transform:scale(.6)}50%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@keyframes logoIn{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* ---------- onboarding entry ---------- */
.ob-art>div:first-child{animation:obArt .7s cubic-bezier(.2,.8,.2,1) both}
.ob-pill{animation:pillIn .55s cubic-bezier(.2,.9,.3,1.3) .35s both,bob 4s ease-in-out 1s infinite}
.ob-pill2{animation-delay:.5s,1.4s}
.ob-copy{animation:fadeUp .6s ease .25s both}
@keyframes obArt{from{opacity:0;transform:scale(.94)}}
@keyframes pillIn{from{opacity:0;transform:translateY(10px) scale(.8)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
/* ---------- home motion ---------- */
.pwwrap{position:relative;display:flex;align-items:center;justify-content:center}
.pw{transition:transform .15s}.pw:active{transform:scale(.94)}
.hero .r1{animation:breathe 5s ease-in-out infinite}.hero .r2{animation:breathe 5s ease-in-out .8s infinite}
@keyframes breathe{0%,100%{transform:translate(-50%,-56%) scale(1)}50%{transform:translate(-50%,-56%) scale(1.045)}}
.wave{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(47,107,255,.45);animation:wave 2s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
.wave:nth-child(2){animation-delay:.66s}.wave:nth-child(3){animation-delay:1.33s}
.pwwrap.on .wave{border-color:rgba(140,118,214,.35);animation-duration:3.2s}
@keyframes wave{from{transform:scale(1);opacity:1}to{transform:scale(1.9);opacity:0}}

/* ================= state =================
   One persisted store `S`. Per-person data lives in a profile
   (each account, or the guest) so nothing leaks between users.
   Bridged keys on S (S.plan, S.qc, S.data…) read/write the active profile. */
const STORE_KEY='vesper:v2';
const today=()=>new Date().toDateString();
const QUOTA={guest:500,free:1024};
const newProfile=(o={})=>Object.assign({pw:'',name:'Demo User',phone:'+1 234 567 8900',premium:false,plan:null,cancelled:false,trialEnded:false,qc:[],fav:[],data:QUOTA.free,day:today(),
  seen:{trial:false,notif:false,rateHome:false,rateMenu:false}},o);
const DEF={v:2,screen:'splash',hist:[],ov:null,
  session:null,email:'',accounts:{'demouser@email.com':newProfile({pw:'password123'})},guest:newProfile({data:QUOTA.guest}),
  vpn:'off',since:0,perm:false,loc:null,
  tour:null,ob:0,planSel:null,stars:0,otpFor:'signup',otpErr:false,resetEmail:'',pending:null,signVariant:0,reason:0,info:null,proto:'oc',protoHelp:'oc',faq:0,search:false,q:'',exp:null,

  notif:{vpnd:true,cfail:true,auto:false,trial:true,pay:true,offer:false,upd:false,tips:false},
  chat:[],topic:null,teamSize:null,sentEmail:null,salesSent:null,ticket:0,agree:false,coName:'Alex Johnson',coEmail:'alex@gmail.com',guestTipShow:false,hintShown:false};

let S;
try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');S=Object.assign(JSON.parse(JSON.stringify(DEF)),saved&&saved.v===2?saved:{})}catch(e){S=JSON.parse(JSON.stringify(DEF))}
if(S.screen==='processing')S.screen='checkout';          // payment never resumes after a reload
if(S.vpn==='connecting')S.vpn='off';                      // a half-finished connect is dropped
const ANON=newProfile();
function profile(){
  const p=S.session==='guest'?S.guest:S.session==='user'?S.accounts[S.email]:null;
  if(!p)return ANON;
  if(!p.fav)p.fav=[];
  if(p.day!==today()){p.day=today();p.data=S.session==='guest'?QUOTA.guest:QUOTA.free}   // daily free-data reset
  return p;
}
Object.defineProperty(S,'user',{enumerable:false,
  get(){if(S.session==='guest')return 'guest';const a=S.session==='user'&&S.accounts[S.email];return a?(a.premium?'premium':'free'):null},
  set(v){if(!v)S.session=null;else if(v==='guest')S.session='guest';else{S.session='user';const a=S.accounts[S.email];if(a)a.premium=v==='premium'}}});
['name','phone','plan','cancelled','trialEnded','qc','fav','data'].forEach(k=>Object.defineProperty(S,k,{enumerable:false,get:()=>profile()[k],set:v=>{profile()[k]=v}}));
[['trialShown','trial'],['notifAsked','notif'],['rateHome','rateHome'],['rateMenu','rateMenu']].forEach(([k,f])=>Object.defineProperty(S,k,{enumerable:false,get:()=>profile().seen[f],set:v=>{profile().seen[f]=!!v}}));

function save(now){clearTimeout(saveT);const w=()=>{try{const o={};for(const k of Object.keys(S))if(!TRANSIENT.includes(k))o[k]=S[k];localStorage.setItem(STORE_KEY,JSON.stringify(o))}catch(e){}};now?w():saveT=setTimeout(w,150)}

/* named timers — cleared together so no stale callback fires on a new state */

home:'<path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="currentColor"/><path d="M12 11l4 1.5v2.5c0 2-1.7 3.6-4 4.2-2.3-.6-4-2.2-4-4.2v-2.5z" fill="#fff"/>',
anon:'<path d="M12 2l8 3v7c0 4.6-3.4 8.6-8 10-4.6-1.4-8-5.4-8-10V5z" fill="currentColor"/><circle cx="12" cy="10" r="2.3" fill="#fff"/><path d="M8 16.5c.6-1.8 2.2-3 4-3s3.4 1.2 4 3" fill="#fff"/>',
game:'<path d="M7 7h10a5 5 0 0 1 5 5v1a4 4 0 0 1-7 2.6L14 15h-4l-1 .6A4 4 0 0 1 2 13v-1a5 5 0 0 1 5-5z" fill="currentColor"/><path d="M7 10v4M5 12h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="15.5" cy="11" r="1.1" fill="#fff"/><circle cx="17.5" cy="13" r="1.1" fill="#fff"/>',
cast:'<rect x="3" y="4" width="18" height="14" rx="3" fill="currentColor"/><path d="M6 15a3 3 0 0 1 3 3M6 12a6 6 0 0 1 6 6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="6.5" cy="17.5" r="1" fill="#fff"/>'};

 {img:'img/ob1.jpg',t:'Fast, Simple, and<br>Reliable',s:'Unleash the Speed. Secure Your Connection.',a:['shield','Reliable','tl'],b:['lock','Protected','br']},
 {img:'img/ob2.jpg',t:'Private and<br>Anonymous',s:'Browse anonymously and confidently, knowing your data is safe.',a:['home','Secure','tr'],b:['anon','Anonymous','bl']},
 {img:'img/ob3.jpg',t:'No Limits,<br>Anywhere',s:'Unrestricted Streaming, Gaming, and Browsing.',a:['game','Gaming','tr'],b:['cast','Streaming','bl']}];

SC.onboard=()=>`${safeTop()}<div class="scr" style="display:flex;flex-direction:column;overflow:hidden">
<div class="obview" id="obview" aria-roledescription="carousel" aria-label="Introduction"><div class="obtrack" id="obtrack" style="transform:translateX(-${(S.ob||0)*100}%)">
${OB.map((o,i)=>`<section class="obslide" aria-roledescription="slide" aria-label="${i+1} of 3" ${i===(S.ob||0)?'':'aria-hidden="true"'}>

</div></div>
<div class="obdots" role="tablist" aria-label="Choose slide">${OB.map((_,i)=>`<button class="obdot ${i===(S.ob||0)?'on':''}" role="tab" aria-selected="${i===(S.ob||0)}" aria-label="Slide ${i+1}" data-act="obGo" data-arg="${i}"><i></i></button>`).join('')}</div>

/* 02 Create Account */
SC.signup=()=>{const v=S.signVariant;return `${safeTop()}${v?backBack():''}<div class="scr"><div class="col pad" style="gap:14px;padding:${v?'50px':'20px'} 24px 30px">
${logo()}<h1 class="h1" style="margin-top:${v?70:26}px">Create Account</h1>
${v?'':`<button class="btn btn-o" data-act="google"><span class="gl">G</span>Continue with Google</button><div class="or">— or sign up with email —</div>`}
${fld('Email or Phone','su-email',{ph:'email@example.com'})}

<div class="agree" data-act="agree" style="cursor:pointer;padding:6px 8px"><span class="chk ${S.agree?'on':''}" id="chk" style="margin-top:6px"></span><span style="font-size:15px">By signing up you agree to our Terms and Conditions Privacy Policy</span></div>

${v?'':`<div style="position:relative"><button class="btn btn-o" data-act="ov" data-arg="guest" data-tour="guestbtn">${ic('alert')}Continue as Guest</button>
</div>`}</div></div>`};

/* 03 Sign In & Welcome */
SC.signin=()=>{const v=S.signVariant;return `${safeTop()}${v?backBack():''}<div class="scr"><div class="col pad" style="gap:16px;padding:50px 24px 30px">
${logo()}<h1 class="h1" style="margin-top:${v?80:18}px">${v?'Sign in to your account':'Sign in'}</h1>
<div id="authErr"></div>
${v?'':`<button class="btn btn-o" data-act="google"><span class="gl">G</span>Continue with Google</button><div class="or">or sign in with email</div>`}
${fld('Email or Phone','si-email',{ph:'email@example.com'})}

<button class="btn btn-p" id="siBtn" data-act="signin" ${v?'':'disabled'} style="margin-top:8px">Sign in</button>
<p class="small c" style="margin:4px 0;font-size:15px">Don't have an account? <a class="lnk" data-act="${v?'toSignupBack':'toSignup'}">Sign Up</a></p>
${v?'':`<button class="btn btn-o" data-act="ov" data-arg="guest">${ic('alert')}Continue as Guest</button>`}</div></div>`};

/* 04 Email Verification & OTP */
SC.verify=()=>`${safeTop()}${backBack()}<div class="scr">${logo('margin-top:40px')}<div class="col pad" style="gap:22px;margin-top:110px">
<h1 class="h1">Email Verification</h1><p style="margin:0;font-size:15px;line-height:1.6;color:var(--blue-d)">We Sent a link in email for verification code to your email "${S.email}"</p>
<button class="btn btn-p" data-act="go" data-arg="otp">Get the Code</button></div></div>`;
SC.otp=()=>{const m=(S.otpFor==='reset'?S.resetEmail:S.email)||'';const masked=m.replace(/^(.)[^@]*/,'$1•••');return `${safeTop()}${backBack()}<div class="scr">${logo('margin-top:40px')}<div class="col pad" style="gap:12px;margin-top:110px">
<h1 class="h1">Submit OTP</h1><p style="margin:0;font-size:15px;line-height:1.6">A 4-digit verification code was sent to your email<br>${masked}</p>
<label class="lbl" style="margin-top:16px;font-weight:500">OTP</label>
<div class="otp ${S.otpErr?'err':''}" id="otp" style="gap:24px">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" data-i="${i}" aria-label="Digit ${i+1}">`).join('')}</div>
${S.otpErr?'<p class="errt">Enter your correct OTP</p>':''}
<button class="btn btn-p" data-act="otp" style="margin-top:18px">Submit</button></div></div>`};

/* 05 Forgot Password */
SC.forgot=()=>`${safeTop()}${backBack()}<div class="scr">${logo('margin-top:40px')}<div class="col pad" style="gap:18px;margin-top:110px">
<h1 class="h1">Forgot Password</h1><p class="p" style="font-size:17px">Enter your email or phone number to reset your password.</p>
${fld('Email or Phone','fp-email',{ph:'email@example.com'})}
<button class="btn btn-p" style="margin-top:6px" data-act="forgot">Send Reset Link</button></div></div>`;
SC.checkEmail=()=>`${safeTop()}${backBack()}<div class="scr">${logo('margin-top:40px')}<div class="col pad" style="gap:16px;margin-top:60px;align-items:center">
<div class="ib" style="width:80px;height:80px">${ic('mail','l')}</div><h1 class="h1 c" style="margin-top:22px">Check Your Email</h1>
<p class="p c" style="font-size:16px;line-height:1.7">We've sent a verification code (OTP) to<br><b class="gt" style="font-size:17px">${S.resetEmail}</b><br>Please check your inbox and enter the code.</p>

<p class="small c" style="margin:20px 0 0">Didn't receive email? <a class="lnk" data-act="noop">Resend</a></p>
<p class="small c" style="margin:110px 0 0" data-act="back">Wrong email? Go back to change it</p></div></div>`;
SC.setPw=()=>`${safeTop()}<div class="scr">${logo('margin-top:90px')}<div class="col pad" style="gap:18px;margin-top:60px">
<h1 class="h1">Set New Password</h1>
<div class="inp lock">${ic('shield','','color:var(--ok)')}<span class="t">${S.resetEmail}</span>${ic('lock','s','color:var(--mute)')}</div>
${fld('Set New Password','np-pw',{type:'password',ph:'Password'})}
${fld('Confirm Password','np-pw2',{type:'password',ph:'Password'})}
<button class="btn btn-p" style="margin-top:8px" data-act="setPw">Submit</button></div></div>`;

/* 06-08 Home (Free / Guest / Premium) */
SC.home=()=>{
const v=S.vpn,prem=S.user==='premium',guest=S.user==='guest';
const heroCls=v==='on'?'hero on':v==='fail'?'hero fail':v==='connecting'?'hero cn':'hero';
const btn=v==='off'?`<button class="btn btn-p" data-act="connect" data-tour="connect">Connect</button>`:v==='connecting'?`<button class="btn btn-o" data-act="cancelConn">${ic('alert')}Cancel</button>`:v==='on'?`<button class="btn btn-o" data-act="disconnect" style="${isFree()?'background:var(--tint)':''}">${ic('alert')}Disconnect</button>`:`<button class="btn btn-p" data-act="connect">Retry</button>`;
const STEPS=['Finding fastest server…','Securing connection…','Encrypting traffic…'];
const el=S.connAt?Date.now()-S.connAt:0;
const stat=v==='off'?`Current internet status ${ic('down','s')}`:v==='connecting'?`<span class="cstat"><span style="color:#7A4A00;font-weight:600">Connecting<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></span><small id="cstep">${STEPS[Math.min(2,Math.floor(el/600))]}</small></span>`:v==='on'?`<span id="timer">Connected · ${fmt(Date.now()-S.since)}</span> ${ic('down','s')}`:`<span style="color:var(--err)">Connection failed</span>`;
const shown=S.loc||(v!=='off'||prem?{c:'au',n:'Australia',city:'Melbourne',fast:!prem}:null);
const loc=shown?`${shown.fast&&v!=='on'?`<span class="fastp">${ic('bolt','s','color:#F59E0B;width:16px;height:16px')}Fastest</span>`:''}<span class="flag f-${shown.c}"></span><div class="nm" style="font-size:19px;letter-spacing:.02em">${shown.n}<br>${shown.city}</div>`
 :`<span class="ib" style="width:44px;height:44px">${ic('bolt')}</span><div class="nm"><b style="font-weight:500;font-size:18px">Free Server</b><span style="font-size:14px;color:var(--ink2);letter-spacing:.03em">Auto-selected · Fastest available</span></div>`;
const qcList=quick();
const qc=qcList.length?`<div class="qc">${qcList.map((q,i)=>`<button class="qcc" data-act="qc" data-arg="${i}" aria-label="Connect to ${q.n}${q.b==='heart'?' (favorite)':' (recent)'}">${flag(q.c)}${q.b?`<span class="qb">${ic(q.b,'',`color:${q.b==='heart'?'#E0245E':'var(--mute)'};${q.b==='heart'?'fill:#E0245E':''}`)}</span>`:''}${q.n.length>13?q.n.slice(0,12)+'…':q.n}</button>`).join('')}</div>`:`<div class="empty">Your Quick Connect servers will appear here</div>`;
const header=guest?`<div class="guest">${ic('info','s')}<a data-act="guestTip" data-tour="guest" style="color:var(--ink2);font-weight:500">Browsing as Guest</a> · <a data-act="toSignup" class="u">Sign Up</a></div>`:'';
return `${header}
<div class="${heroCls} ${guest?'g':''}">
${setup()?(()=>{const s=setup(),d=setupDone(s);return `<button class="setupbtn" data-act="ov" data-arg="setup" aria-label="Getting started checklist, ${d} of ${SETUP.length} done">${ring(d,SETUP.length)}<span>${d}/${SETUP.length}</span></button>`})():''}
${v==='on'&&isFree()?`<div class="datap"><span class="dot"></span><span id="dleft">${Math.max(0,Math.round(S.data))} MB left today</span><a data-act="upgrade">Upgrade</a></div>`:''}
<div class="vis"><div class="ring r1"></div><div class="ring r2"></div><div class="pwwrap ${v}">${v==='connecting'?`<span class="sweep" aria-hidden="true"></span>`:''}${v==='connecting'||v==='on'?'<span class="wave"></span><span class="wave"></span><span class="wave"></span>':''}${v==='connecting'?`<span class="orbit o1" aria-hidden="true"><i></i></span><span class="orbit o2" aria-hidden="true"><i></i></span><span class="orbit o3" aria-hidden="true"><i></i></span><svg class="prog" viewBox="0 0 220 220" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FA2FF"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs><circle class="prog-bg" cx="110" cy="110" r="100"/><circle class="prog-fg" cx="110" cy="110" r="100" style="animation-delay:-${el}ms"/></svg>`:''}${v==='on'?'<span class="burst" aria-hidden="true"></span>':''}<button class="pw" data-act="power" aria-label="${v==='on'?'Disconnect':v==='connecting'?'Cancel connecting':'Connect'}">${ic('power')}</button></div>
<div class="stat" role="status" aria-live="polite">${stat}</div></div>
<div class="card">${btn}
<div class="loc" data-tour="loc" data-act="tab" data-arg="servers" role="button" tabindex="0" aria-label="Choose server location" style="cursor:pointer;border-radius:16px">${loc}${prem?`<span class="pill gold">${ic('crown','s','width:12px;height:12px')}PREMIUM</span>`:''}<button data-act="tab" data-arg="servers" aria-label="Change server" style="border:0;background:none;color:var(--faint);padding:4px;display:flex;margin-left:auto">${ic('refresh')}</button></div>
${qcList.length?'':'<div class="hist">CONNECTION HISTORY</div>'}<div data-tour="qc" class="col" style="gap:12px;border-radius:16px"><b style="font-size:15px">Quick Connect</b>${qc}</div></div></div>
${prem&&S.trialEnded?`<div class="row" style="position:absolute;left:14px;right:14px;top:max(16px,env(safe-area-inset-top));z-index:4;gap:10px;background:#141A2E;color:#fff;border-radius:16px;padding:12px 12px 12px 16px"><div class="col" style="flex:1;gap:2px"><b style="font-size:14px">Trial ended — payment in 24h</b><span style="font-size:13px;color:#A9B6D9">You'll be charged unless you cancel</span></div><a data-act="trialCancel" style="background:#3A4256;color:#fff;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600">Cancel</a><a data-act="trialPay" style="background:var(--grad);color:#fff;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600">Pay Now</a></div>`:''}



${tabs('home')}`};
SC.offline=()=>`${safeTop()}<div class="col pad" style="align-items:center;gap:16px;margin-top:180px">${ic('wifioff','','width:110px;height:110px;color:#B5B5B5;stroke-width:1')}<h1 class="h2 c" style="font-size:26px;margin-top:20px">No Internet Connection</h1><p class="p c" style="font-size:17px">Please check your network connection and try again.</p><button class="btn btn-p" style="margin-top:18px" data-act="retryNet">Retry</button></div>${tabs('home')}`;

/* 09 Server List */
const srvRows=()=>{const q=S.q.toLowerCase(),prem=S.user==='premium';
const list=COUNTRIES.filter(c=>c[1].toLowerCase().includes(q));
const row=c=>{const locked=!prem&&!c[3];const open=S.exp===c[0]&&!locked;const f=isFav(c[0]);
if(locked)return `<div class="srow"><button class="srow-main" data-act="locked" data-arg="${c[0]}" aria-label="${c[1]}, premium only">${flag(c[0])}<span style="flex:1;color:var(--mute)">${c[1]}</span><span class="lockb"><span class="pro" style="color:var(--blue);background:var(--tint)">PRO</span>${ic('lock')}</span></button></div>`;
return `<div class="srow"><button class="srow-main" data-act="exp" data-arg="${c[0]}" aria-expanded="${open}">${flag(c[0])}<span class="cname">${c[1]}<small>${c[2].length} location${c[2].length>1?'s':''}</small></span></button><button class="fav ${f?'on':''} ${S.favPop===c[0]?'pop':''}" data-act="fav" data-arg="${c[0]}" aria-pressed="${f}" aria-label="${f?'Remove '+c[1]+' from favorites':'Add '+c[1]+' to favorites'}">${ic('heart')}</button><button class="chevb" data-act="exp" data-arg="${c[0]}" aria-label="Show ${c[1]} cities" aria-expanded="${open}">${ic(open?'up':'down')}</button></div>
${open?`<div class="cities" role="list">${c[2].map((ct,k)=>{const ms=latency(c[0],k),sel=S.loc&&S.loc.c===c[0]&&S.loc.city===ct;return `<button class="city ${sel?'sel':''}" role="listitem" data-act="pick" data-arg="${c[0]}|${ct}" aria-label="${ct}, ${c[1]}, ${ms} milliseconds${sel?', selected':''}"><span class="pin">${ic('pin','s')}</span><span class="cn"><b>${ct}</b><small>${c[0].toUpperCase()}-${String(k+1).padStart(2,'0')} · ${ms} ms</small></span>${bars(ms)}${sel?ic('check','s','color:var(--blue);stroke-width:2.6'):''}</button>`}).join('')}</div>`:''}`};
const favs=list.filter(c=>isFav(c[0])&&(prem||c[3]));
const favBlock=!S.search&&favs.length?`<p class="sec" style="padding:18px 0 4px">Favorites</p>`+favs.map(row).join('')+`<p class="sec" style="padding:22px 0 4px">All servers</p>`:'';
if(prem||S.search)return favBlock+list.filter(c=>S.search||!isFav(c[0])).map(row).join('');
return favBlock+list.filter(c=>c[3]&&!isFav(c[0])).map(row).join('')+`<p class="sec" style="padding:22px 0 4px">Premium countries</p>`+list.filter(c=>!c[3]).map(row).join('');};
SC.servers=()=>{
if(S.srvErr)return `${safeTop()}<div class="row pad" style="justify-content:space-between;padding-top:30px"><h1 class="h1">Server List</h1><span class="tile" style="border-radius:50%">${ic('search')}</span></div><div class="col pad" style="align-items:center;gap:16px;margin-top:150px"><div class="ib lg" style="background:#FDE4E4;color:var(--err);box-shadow:none">${ic('warn','xl')}</div><h2 class="h2 c" style="font-size:28px;margin-top:8px">Connection Check Failed</h2><p class="p c">Unable to verify server connection. Please check your internet connection and try again.</p><button class="btn btn-p" style="margin-top:10px" data-act="retrySrv">Retry</button></div>${tabs('servers')}`;
if(S.search)return `${safeTop()}<div class="pad" style="padding-top:28px"><div class="inp" style="height:52px">${ic('search','','color:var(--mute)')}<input id="srch" placeholder="Search a server" value="${S.q}"></div></div><div class="scr"><div class="col pad" id="slist">${srvRows()}</div></div>`;
return `${safeTop()}<div class="row pad" style="justify-content:space-between;padding-top:30px;padding-bottom:6px"><h1 class="h1">Server List</h1><button class="tile" style="border-radius:50%;border:0" data-act="openSearch" aria-label="Search">${ic('search')}</button></div>
<div class="scr"><div class="col pad" style="padding-bottom:110px">
${isFree()&&!S.srvLoading?`<div class="note" style="margin-top:8px">${ic('info')}<div><b>Why choose a server country?</b>Your server location affects speed, content access, and privacy. Choose nearby servers for speed, or specific countries to access region-locked content.</div></div>`:''}
<div id="slist">${S.srvLoading?Array.from({length:10},(_,i)=>`<div class="srow sk"><span class="skel" style="width:36px;height:26px;border-radius:6px"></span><span class="skel" style="width:${120+(i*37)%80}px;height:16px"></span><span style="flex:1"></span><span class="skel" style="width:22px;height:22px"></span></div>`).join(''):srvRows()}</div></div></div>${tabs('servers')}`};

/* 10 Choose Your Plan */
SC.plans=()=>{const sel=S.planSel,p=sel&&planOf(sel);return `${safeTop()}${arrowLogo()}

/* ================= coach marks (one shared component) =================
   Every hint uses the same card: spotlight on the target, white card with arrow,
   optional title, body, step counter and Skip / Next. Positioned after render. */
const TOUR=[
 {t:'[data-tour="connect"]',title:'Tap this button',body:'to start connecting to the VPN'},
 {t:'[data-tour="loc"]',title:'Tap to choose your free country',body:'Pick one of the 5 free locations, or let us pick the fastest one.'},
 {t:'[data-tour="qc"]',title:'Quick Connect',body:'Your favorite and recent servers appear here for one-tap connecting.'},
 {t:'.tabs .tab:last-child',title:'Menu',body:'Find your account, settings, subscription and support here.'}];
function activeCoach(){
  if(S.ov)return null;
  if(S.screen==='home'&&S.tour!=null&&S.vpn!=='connecting'&&TOUR[S.tour])return {...TOUR[S.tour],step:S.tour+1,total:TOUR.length,dim:true};
  if(S.screen==='home'&&S.guestTipShow&&S.user==='guest')return {t:'[data-tour="guest"]',title:'Guest mode',body:'Guests receive 500 MB of data. Sign up for a free account for 1 GB/day.',ok:'Got it',okAct:'guestTip'};
  if(S.screen==='signup'&&S.guestHint)return {t:'[data-tour="guestbtn"]',title:'Continue as Guest',body:'Limited data & servers · no account needed',ok:'Got it',okAct:'hideHint'};
  return null;
}
function coachHTML(){const c=activeCoach();if(!c)return '';
  return `<div class="spot ${c.dim?'':'light'}" id="spot" aria-hidden="true"></div><div class="coach" id="coach" role="dialog" aria-live="polite" aria-label="${c.title}" data-target='${c.t}'><span class="carrow"></span>
  ${c.step?`<span class="cstep">Step ${c.step} of ${c.total}</span>`:''}<b class="ctitle">${c.title}</b><p class="cbody">${c.body}</p>
  <div class="cfoot">${c.step?`<button class="clink" data-act="tourSkip">Skip tour</button><button class="cbtn" data-act="tourNext">${c.step===c.total?'Done':'Next'}</button>`:`<span></span><button class="cbtn" data-act="${c.okAct}">${c.ok}</button>`}</div></div>`}
function placeCoach(){
  const c=$('#coach'),sp=$('#spot'),ph=$('.ph');if(!c||!ph)return;
  const tg=document.querySelector(c.dataset.target);if(!tg){c.remove();sp&&sp.remove();return}
  const sc=tg.closest('.scr');if(sc){const a=tg.getBoundingClientRect(),b=sc.getBoundingClientRect();if(a.bottom>b.bottom-90||a.top<b.top+8)sc.scrollTop+=a.top-b.top-(b.height-a.height)/2}
  const P=ph.getBoundingClientRect(),r=tg.getBoundingClientRect(),pad=6;
  const x=r.left-P.left,y=r.top-P.top,cx=x+r.width/2;
  const rad=parseFloat(getComputedStyle(tg).borderTopLeftRadius)||12;
  Object.assign(sp.style,{left:x-pad+'px',top:y-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px',borderRadius:rad+pad+'px'});
  const w=Math.min(P.width-32,340);c.style.width=w+'px';
  const left=Math.max(16,Math.min(P.width-16-w,cx-w/2));c.style.left=left+'px';
  const h=c.offsetHeight,below=y+r.height+pad+14+h<P.height-20;
  c.style.top=(below?y+r.height+pad+14:y-pad-14-h)+'px';c.classList.toggle('above',!below);
  c.querySelector('.carrow').style.left=Math.max(20,Math.min(w-20,cx-left))+'px';
}
addEventListener('resize',placeCoach);
document.addEventListener('scroll',e=>{if($('#coach')&&e.target.classList&&e.target.classList.contains('scr'))placeCoach()},true);

/* ================= getting-started checklist (new accounts) ================= */
const SETUP=[
 {k:'account',t:'Create your account',s:'You\'re in. Welcome to VesperVPN!'},
 {k:'connect',t:'Connect to the VPN',s:'Tap Connect on Home to secure your traffic.',go:'tourConnect'},
 {k:'server',t:'Choose a server location',s:'Pick a country and city in Server List.',go:'setupServers'},
 {k:'fav',t:'Add a favorite server',s:'Tap the heart next to a country.',go:'setupServers'},
 {k:'notif',t:'Review notification alerts',s:'Choose which alerts you want to get.',go:'setupNotif'}];
const setup=()=>{const p=profile();return S.session==='user'&&p.setup&&!p.setup.hidden?p.setup:null};
const setupDone=s=>SETUP.filter(x=>s[x.k]).length;
function markSetup(k){const s=setup();if(!s||s[k])return;s[k]=true;const d=setupDone(s);
  $('#live')&&($('#live').textContent=`Checklist: ${SETUP.find(x=>x.k===k).t} done. ${d} of ${SETUP.length} complete.`);
  if(d===SETUP.length)S.setupCelebrate=true}
const ring=(d,n,size=44)=>{const r=size/2-4,C=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#DCE5FB" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-d/n)}" style="transition:stroke-dashoffset .5s"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#1E3FAE"/><stop offset="1" stop-color="#4361EE"/></linearGradient></defs></svg>`};

/* ================= render & navigation ================= */
let lastScreen=null;
function render(){
  const keep=lastScreen===S.screen?($('.scr')||{}).scrollTop:0;
  const fx=S.fx;S.fx=null;
  $('#app').innerHTML=`<div class="ph ${lastScreen!==S.screen?'screen-in':''} ${fx?'fx-'+fx:''}">${SC[S.screen]()}${S.ov&&OV[S.ov]?OV[S.ov]():''}${coachHTML()}</div>`;
  if($('#coach')){placeCoach();requestAnimationFrame(placeCoach);later('coach',placeCoach,620);document.fonts&&document.fonts.ready.then(placeCoach)}
  const sc=$('.scr');if(sc&&keep)sc.scrollTop=keep;
  lastScreen=S.screen;save();
  if(S.screen==='otp'&&!S.otpErr){const f=document.querySelector('#otp input');f&&f.focus()}
  if(S.screen==='onboard')obAuto();
}
/* onboarding carousel: auto-advance, dots, swipe — moves the track without re-rendering */
function obSet(i){S.ob=(i+OB.length)%OB.length;const tr=$('#obtrack');if(!tr)return;tr.style.transform=`translateX(-${S.ob*100}%)`;
  document.querySelectorAll('.obslide').forEach((s,k)=>k===S.ob?s.removeAttribute('aria-hidden'):s.setAttribute('aria-hidden','true'));
  document.querySelectorAll('.obdot').forEach((d,k)=>{d.classList.toggle('on',k===S.ob);d.setAttribute('aria-selected',k===S.ob)});save();obAuto()}
function obAuto(){later('ob',()=>{if(S.screen==='onboard')obSet(S.ob+1)},4500)}
let obX=null;
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#obview'))obX=e.clientX});
document.addEventListener('pointerup',e=>{if(obX==null)return;const dx=e.clientX-obX;obX=null;if(Math.abs(dx)>40)obSet(S.ob+(dx<0?1:-1))});
/* route guard: which screens need a session */
const PUBLIC=['splash','onboard','signup','signin','verify','otp','forgot','checkEmail','setPw','deleted','suspended','terms','support','about','update','offline','emailSupport','chat','sales'];
const GUEST_OK=['home','servers','menu','plans','notifications'];
const allowed=s=>!!SC[s]&&(PUBLIC.includes(s)||(S.session==='user')||(S.session==='guest'&&GUEST_OK.includes(s)));
const fallback=()=>S.session?'home':'signin';
function go(s){if(!allowed(s))s=fallback();S.hist.push(S.screen);S.screen=s;S.ov=null;enter(s);history.pushState({d:S.hist.length},'','#'+s);render()}
function goRoot(s){if(!allowed(s))s=fallback();S.hist=[];S.screen=s;S.ov=null;enter(s);history.replaceState({d:0},'','#'+s);render()}
function goUnder(parent,s){S.hist=[parent];S.screen=s;S.ov=null;enter(s);history.replaceState({d:1},'','#'+s);render()}
function popBack(){if(S.ov){S.ov=null;render();return}if(S.search){S.search=false;S.q='';render();return}
  const from=S.screen;let s=S.hist.pop();while(s&&!allowed(s))s=S.hist.pop();S.screen=s||fallback();enter(S.screen,from);render()}
function back(){if(history.state&&history.state.d>0)history.back();else popBack()}
addEventListener('popstate',()=>{if(['processing','welcome','deleted'].includes(S.screen)){history.pushState({d:S.hist.length},'','#'+S.screen);return}popBack()});
function enter(s,from){
  S.guestTipShow=false;
  if(s==='servers'&&!from){S.srvErr=!navigator.onLine;if(!S.srvErr&&!S.srvSeen){S.srvSeen=true;S.srvLoading=true;later('srv',()=>{S.srvLoading=false;if(S.screen==='servers')render()},900)}}
  if(s==='otp')S.otpErr=false;
  if(s==='notifications')markSetup('notif');
  if(s==='home'&&S.setupCelebrate&&!S.ov){S.setupCelebrate=false;S.ov='setup'}
  if(s==='emailSupport'){S.sentEmail=null;S.topic=null}
  if(s==='sales'){S.salesSent=null;S.teamSize=null}
  if(s==='chat'&&!S.chat.length)S.chat=[{t:"Hi, I'm Maya from VesperVPN Support. How can I help you today?"}];
  if(s==='settings')S.info=from==='split'?'split':null;
  if(s==='menu'&&!from&&S.user==='premium'&&!S.rateMenu&&S.rateHome){S.rateMenu=true;S.stars=0;S.ov='rateSheet'}
}
const openOv=o=>{S.ov=o;S.stars=0;S.limitNoteHidden=false;render()};

/* ================= session ================= */
function startSession(kind,email){
  VPN.reset();Object.assign(S,{loc:null,tour:null,ov:null,planSel:null,search:false,q:'',exp:null,pending:null,guestTipShow:false});
  if(kind==='guest'){S.session='guest';S.email='';S.guest=newProfile({data:QUOTA.guest})}
  else{S.session='user';S.email=email}
}
function endSession(){VPN.reset();Object.assign(S,{session:null,loc:null,ov:null,planSel:null,tour:null,signVariant:0,search:false,q:''})}

/* ================= VPN state machine: off → connecting → on | fail ================= */
const FASTEST={c:'au',n:'Australia',city:'Melbourne'};
const VPN={
  connect(){
    if(S.vpn==='connecting'||S.vpn==='on')return;
    if(S.tour===0)S.tour=1;S.guestTipShow=false;
    if(isFree()&&S.data<=0)return openOv('limit');
    if(!S.perm)return openOv('perm');
    S.vpn='connecting';S.fx='connecting';S.connAt=Date.now();render();
    [600,1200].forEach((ms,i)=>later('step'+i,()=>{const s=$('#cstep');if(s&&S.vpn==='connecting'){s.textContent=['Securing connection…','Encrypting traffic…'][i];s.classList.remove('swap');void s.offsetWidth;s.classList.add('swap')}},ms));
    later('vpn',()=>{
      if(S.vpn!=='connecting')return;
      if(!navigator.onLine||(S.loc&&S.loc.c==='cn')){S.vpn='fail';S.fx='fail';return render()}
      S.vpn='on';S.since=Date.now();S.fx='on';markSetup('connect');
      {const c=S.loc||FASTEST;S.qc=[{c:c.c,n:c.n,city:c.city},...S.qc.filter(q=>q.c!==c.c)].slice(0,3)}
      if(S.user==='premium'&&!S.notifAsked){S.notifAsked=true;S.ov='notif'}
      render();
    },1800);
  },
  cancel(){stop('vpn');S.vpn='off';S.fx='off';render()},
  disconnect(prompts=true){
    if(S.vpn!=='on')return;
    S.vpn='off';S.since=0;S.fx='off';
    if(prompts){
      if(S.user==='free'&&!S.trialShown){S.trialShown=true;S.ov='trial'}
      else if(S.user==='premium'&&!S.rateHome){S.rateHome=true;S.stars=0;S.ov='rate'}
    }
    render();
  },
  fail(){stop('vpn');S.vpn='fail';S.fx='fail'},
  reset(){stop('vpn');S.vpn='off';S.since=0},
  switchTo(loc,forceConnect){const active=S.vpn==='on'||S.vpn==='connecting';this.reset();S.loc=loc;goRoot('home');if(active||forceConnect)this.connect()}
};

const A={
  noop:()=>{},back,go,
  close:()=>{S.ov=null;render()},ov:(a)=>openOv(a),
  tab:(a)=>{S.ov=null;S.search=false;if(a==='subscription')return goUnder('menu','subscription');goRoot(a)},
  eye:(id,el)=>{const i=$('#'+id);i.type=i.type==='password'?'text':'password';el.style.color=i.type==='text'?'var(--blue)':''},
  agree:()=>{S.agree=!S.agree;const c=$('#chk');c.classList.toggle('on',S.agree);c.style.boxShadow='';c.style.borderColor=''},
  toSignin:()=>{S.signVariant=0;goRoot('signin')},
  toSignup:()=>{S.signVariant=0;goRoot('signup');if(!S.hintShown){S.hintShown=true;S.guestHint=true;render()}},
  toSigninBack:()=>{S.signVariant=1;go('signin')},toSignupBack:()=>{S.signVariant=1;go('signup')},
  google:()=>{startSession('user','demouser@email.com');goRoot('home');openOv('welcomeBack')},
  signup:()=>{const e=val('su-email').trim(),p=val('su-pw'),p2=val('su-pw2');let ok=true;
    setErr('su-email',!emailOk(e)?(ok=false,'Enter a valid email or phone number.'):'');
    setErr('su-pw',p.length>=8?'':(ok=false,'Password must be at least 8 characters.'));
    setErr('su-pw2',p2&&p2===p?'':(ok=false,'Passwords do not match.'));
    if(!S.agree){ok=false;const c=$('#chk');c.style.boxShadow='0 0 0 4px rgba(229,72,77,.25)';c.style.borderColor='#E5484D'}
    if(ok){S.pending={e,p};S.email=e;S.otpFor='signup';go('verify')}},
  signin:()=>{const e=val('si-email').trim(),p=val('si-pw');
    if(!emailOk(e)){setErr('si-email','Enter a valid email or phone number.');return}
    if(e==='suspended@email.com'){goRoot('suspended');return}
    const acc=S.accounts[e];
    if(!acc||acc.pw!==p){setErr('si-email',' ');setErr('si-pw','Incorrect email or password. Please try again.');$('#authErr').innerHTML=`<div style="background:var(--err-bg);border:1px solid #FDA29B;color:#B42318;border-radius:12px;padding:14px 22px;font-size:15px">Authentication failed. Please check your credentials.</div>`;return}
    S.pending={e};S.email=e;S.otpFor='signin';go('otp')},
  forgot:()=>{const e=val('fp-email').trim();if(!emailOk(e)){setErr('fp-email','Enter a valid email or phone number.');return}S.resetEmail=e;S.otpFor='reset';go('checkEmail')},
  otp:()=>{const code=[...document.querySelectorAll('#otp input')].map(i=>i.value).join('');
    if(code.length<4){S.otpErr=true;render();[...document.querySelectorAll('#otp input')].forEach((i,k)=>i.value=code[k]||'');return}
    if(S.otpFor==='reset'){goRoot('setPw');return}
    const pend=S.pending;if(!pend){goRoot('signin');return}
    if(S.otpFor==='signin'){startSession('user',pend.e);goRoot('home');openOv('welcomeBack');return}
    S.accounts[pend.e]=newProfile({pw:pend.p,setup:{account:true,connect:false,server:false,fav:false,notif:false,hidden:false}});startSession('user',pend.e);S.tour=0;goRoot('home');openOv('created')},
  setPw:()=>{const p=val('np-pw'),p2=val('np-pw2');let ok=true;
    setErr('np-pw',p.length>=8?'':(ok=false,'Password must be at least 8 characters.'));
    setErr('np-pw2',p2===p&&p2?'':(ok=false,'Passwords do not match.'));
    if(ok){if(S.accounts[S.resetEmail])S.accounts[S.resetEmail].pw=p;S.signVariant=0;goRoot('signin')}},
  asGuest:()=>{startSession('guest');goRoot('home')},
  explorePlans:()=>{S.planSel=null;go('plans')},
  tourNext:()=>{S.tour=S.tour+1<TOUR.length?S.tour+1:null;if(S.tour==null&&setup())openOv('setup');else render()},
  tourSkip:()=>{S.tour=null;render()},
  tourConnect:()=>{S.ov=null;S.tour=0;goRoot('home')},
  setupServers:()=>{S.ov=null;goRoot('servers')},
  setupNotif:()=>{S.ov=null;goRoot('menu');go('notifications')},
  hideSetup:()=>{const p=profile();if(p.setup)p.setup.hidden=true;S.ov=null;render()},
  hideHint:()=>{S.guestHint=false;render()},
  guestTip:()=>{S.guestTipShow=!S.guestTipShow;render()},
  power:()=>{if(S.vpn==='on')VPN.disconnect();else if(S.vpn==='connecting')VPN.cancel();else VPN.connect()},
  connect:()=>VPN.connect(),
  allow:()=>{S.perm=true;S.ov=null;VPN.connect()},
  cancelConn:()=>VPN.cancel(),
  disconnect:()=>VPN.disconnect(),
  qc:(i)=>{const l=quick()[+i];if(l)VPN.switchTo({c:l.c,n:l.n,city:l.city},true)},
  upgrade:()=>{if(S.user==='guest')return openOv('signinContinue');S.planSel=null;go('plans')},
  locked:()=>A.upgrade(),
  openSearch:()=>{S.search=true;history.pushState({d:S.hist.length+1},'','#servers');render();$('#srch').focus()},
  exp:(c)=>{S.exp=S.exp===c?null:c;render()},
  fav:(c)=>{const co=COUNTRIES.find(x=>x[0]===c);if(!co)return;const was=isFav(c);
    S.fav=was?S.fav.filter(f=>f.c!==c):[{c,n:co[1],city:co[2][0]},...S.fav];
    S.favPop=was?null:c;if(!was)markSetup('fav');const keep=$('.scr')&&$('.scr').scrollTop;
    if(S.search){$('#slist').innerHTML=srvRows()}else render();
    if(keep&&$('.scr'))$('.scr').scrollTop=keep;S.favPop=null;
    $('#live').textContent=was?co[1]+' removed from favorites':co[1]+' added to favorites. It now appears in Quick Connect on Home.'},
  pick:(a)=>{const [c,city]=a.split('|');const co=COUNTRIES.find(x=>x[0]===c);if(!co)return;markSetup('server');S.exp=null;S.search=false;S.q='';VPN.switchTo({c,n:co[1],city})},
  retrySrv:()=>{S.srvErr=!navigator.onLine;render()},
  retryNet:()=>{if(navigator.onLine)goRoot('home')},
  plan:(id)=>{S.planSel=S.planSel===id?null:id;render()},
  trialPlan:()=>{S.planSel='year';S.ov=null;if(S.user==='guest')return openOv('signinContinue');go('plans')},
  planGo:()=>{const p=planOf(S.planSel);if(!p)return;
    if(S.user==='guest')return openOv('signinContinue');
    if(p.id==='free')return goRoot('home');
    go('checkout')},
  pay:()=>{S.coName=val('co-name').trim();S.coEmail=val('co-email').trim();
    if(!emailOk(S.coEmail)){setErr('co-email','Enter a valid email or phone number.');return}
    const planId=S.planSel;go('processing');
    later('pay',()=>{if(S.screen!=='processing')return;
      if(!S.coName){S.screen='payfail';history.replaceState({d:S.hist.length},'','#payfail');return render()}
      const acc=S.accounts[S.email];if(!acc)return goRoot('signin');
      Object.assign(acc,{premium:true,plan:planId,cancelled:false,trialEnded:!!planOf(planId).trial,qc:[]});
      VPN.reset();S.loc=null;S.hist=[];S.screen='welcome';history.replaceState({d:0},'','#welcome');render()},2000)},
  startPremium:()=>goRoot('home'),
  trialCancel:()=>{S.trialEnded=false;go('cancelReason')},trialPay:()=>{S.trialEnded=false;render()},
  reactivate:()=>{S.cancelled=false;render()},
  keepSub:()=>goUnder('menu','subscription'),
  doCancel:()=>{S.cancelled=true;openOv('cancelled')},
  reason:(i)=>{S.reason=+i;render()},
  saveProfile:()=>{const n=val('ep-name').trim();if(!n){setErr('ep-name','Enter your full name.');return}S.name=n;S.phone=val('ep-phone');back()},
  changePw:()=>{const c=val('cp-cur'),n=val('cp-new'),n2=val('cp-new2'),acc=S.accounts[S.email];if(!acc)return goRoot('signin');let ok=true;
    setErr('cp-cur',c===acc.pw?'':(ok=false,'Incorrect current password'));
    if(n.length<8){ok=false;$('#w-cp-new').classList.add('err');$('#sl-cp-new').style.color='var(--err)'}
    setErr('cp-new2',n2&&n2===n?'':(ok=false,'Passwords do not match'));
    if(ok){acc.pw=n;go('pwUpdated')}},
  toAccount:()=>goUnder('menu','account'),
  doDelete:()=>{const e=S.email;endSession();delete S.accounts[e];S.email='';goRoot('deleted')},
  signout:()=>{endSession();goRoot('signin')},
  set:(k)=>{S.set[k]=!S.set[k];if(k==='kill')S.info='kill';render()},
  info:(k)=>{S.info=k;render()},
  split:(k)=>{S.split[k]=!S.split[k];render()},
  notif:(k)=>{S.notif[k]=!S.notif[k];render()},
  proto:(k)=>{S.proto=k;render()},protoHelp:(k)=>{S.protoHelp=k;render()},
  faq:(i)=>{S.faq=S.faq===+i?-1:+i;render()},
  obGo:(i)=>obSet(+i),
  topic:(x)=>{S.topic=x;pickChip('topic',x,'e-topic')},teamSize:(x)=>{S.teamSize=x;pickChip('teamSize',x,'e-size')},
  supportDone:()=>{S.sentEmail=null;S.salesSent=null;back()},
  sendEmail:()=>{const e=val('es-email').trim(),m=val('es-msg').trim();let ok=true;
    setErr('es-email',emailOk(e)?'':(ok=false,'Enter a valid email address.'));
    setErr('es-msg',m.length>=10?'':(ok=false,'Please describe your issue (at least 10 characters).'));
    $('#e-topic').textContent=S.topic?'':(ok=false,'Choose a topic.');
    if(ok){S.ticket=(S.ticket||10230)+1;S.sentEmail=e;render()}},
  sendSales:()=>{const n=val('sl-name').trim(),e=val('sl-email').trim(),c=val('sl-co').trim();let ok=true;
    setErr('sl-name',n?'':(ok=false,'Enter your name.'));setErr('sl-email',emailOk(e)?'':(ok=false,'Enter a valid work email.'));setErr('sl-co',c?'':(ok=false,'Enter your company name.'));
    $('#e-size').textContent=S.teamSize?'':(ok=false,'Choose your team size.');
    if(ok){S.salesSent={name:n,email:e};render()}},
  chatQuick:(q)=>chatSay(q),
  chatSend:()=>{const i=$('#chatIn');const m=(i&&i.value||'').trim();if(!m)return i&&i.focus();chatSay(m)},
  toggleAll:(a,el)=>{const ds=[...document.querySelectorAll('#pol details')];const open=!ds.every(d=>d.open);ds.forEach(d=>d.open=open);el.textContent=open?'Collapse all':'Expand all'},
  star:(n)=>{S.stars=+n;render()},
  hideLimitNote:()=>{S.limitNoteHidden=true;render()}
};

function pickChip(act,x,errId){document.querySelectorAll(`[data-act="${act}"]`).forEach(b=>{const on=b.dataset.arg===x;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});const e=$('#'+errId);if(e)e.textContent=''}
function chatReply(m){const s=m.toLowerCase();
  if(/connect|slow|speed|server|wifi/.test(s))return 'Sorry about that! Try switching the protocol in Menu › Protocols, or pick a server close to you in Server List. Are you on Wi-Fi or mobile data?';
  if(/bill|pay|charge|refund|card/.test(s))return 'I can help with billing. You can see all payments in Menu › My Subscription. Refunds are available within 30 days. Would you like me to start one?';
  if(/plan|upgrade|premium|cancel/.test(s))return 'You can change or cancel your plan anytime in Menu › My Subscription. The 1 Year plan is the best value at $3.33/mo.';
  return 'Thanks for the details! I\'ve noted this for our team. Is there anything else I can help you with?'}
function chatSay(m){S.chat.push({me:1,t:m.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))});S.chatTyping=true;render();chatBottom();
  later('chat',()=>{S.chatTyping=false;S.chat.push({t:chatReply(m)});if(S.screen==='chat'){render();chatBottom()}},1300)}
function chatBottom(){const c=$('#chatScroll');if(c)c.scrollTop=c.scrollHeight;const i=$('#chatIn');if(i)i.focus()}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;if(!act||!A[act])return;
  e.preventDefault();e.stopPropagation();A[act](el.dataset.arg,el,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='srch'){S.q=t.value;$('#slist').innerHTML=srvRows();return}
  if(t.id==='appq'){const q=t.value.toLowerCase();document.querySelectorAll('[data-app]').forEach(r=>r.style.display=r.dataset.app.toLowerCase().includes(q)?'':'none');return}
  if(t.closest('.inp'))setErr(t.id,'');
  if(t.id==='es-msg'&&t.value.length>=10)setErr('es-msg','');
  if(t.id==='su-pw'&&$('#st-su-pw')){const s=strength(t.value),bars=[...$('#st-su-pw').children],col=['#CBD5E1','#E5484D','#F59E0B','#3B82F6','#10B981'][s];
    bars.forEach((b,i)=>b.style.background=i<s?col:'');const l=$('#sl-su-pw');l.textContent=t.value?['Weak','Weak','Fair','Good','Strong'][s]:'Strength';l.style.color=t.value?col:''}
  if(t.id==='cp-new'){let st=$('#st-cp-new');const s=strength(t.value),l=$('#sl-cp-new');
    if(t.value.length>=8){if(!st){l.insertAdjacentHTML('beforebegin','<div class="str" id="st-cp-new"><i></i><i></i><i></i></div>');st=$('#st-cp-new')}const n=Math.max(1,Math.min(3,s-1));const col=n===3?'#10B981':n===2?'#F59E0B':'#E5484D';[...st.children].forEach((b,i)=>b.style.background=i<n?col:'');l.textContent=['','Weak','Medium','Strong'][n];l.style.color=col}
    else{if(st)st.remove();l.textContent='Minimum 8 characters';l.style.color=''}}
  if(t.id==='si-email'||t.id==='si-pw'){$('#siBtn').disabled=!(val('si-email')&&val('si-pw'));$('#authErr').innerHTML='';setErr('si-email','');setErr('si-pw','')}
  if(t.id==='del-pw')$('#delBtn').disabled=t.value!==((S.accounts[S.email]||{}).pw);
  if(t.closest('#otp')){t.value=t.value.replace(/\D/g,'').slice(-1);if(t.value&&t.nextElementSibling)t.nextElementSibling.focus();$('#otp').classList.remove('err')}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.id==='chatIn'&&e.key==='Enter'){e.preventDefault();A.chatSend();return}
  if(t.closest&&t.closest('#otp')&&e.key==='Backspace'&&!t.value&&t.previousElementSibling)t.previousElementSibling.focus();
  if(e.key==='Enter'&&t.tagName==='INPUT'){const b=t.closest('.ph').querySelector('.btn-p[data-act]');if(b&&!b.disabled)b.click()}
});
document.addEventListener('paste',e=>{const t=e.target;if(!t.closest||!t.closest('#otp'))return;e.preventDefault();const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);[...document.querySelectorAll('#otp input')].forEach((i,k)=>i.value=d[k]||'')});
addEventListener('offline',()=>{if(S.vpn==='on'||S.vpn==='connecting')VPN.fail();if(S.screen==='home')go('offline');else if(S.screen==='servers'){S.srvErr=true;render()}});
addEventListener('online',()=>{if(S.screen==='offline')goRoot('home')});
addEventListener('pagehide',()=>save(true));
/* 1-second tick: connection timer + free data usage */
setInterval(()=>{
  if(S.vpn!=='on')return;
  if(isFree()){S.data=Math.max(0,S.data-10);const d=$('#dleft');if(d)d.textContent=Math.round(S.data)+' MB left today';
    if(S.data<=0){VPN.disconnect(false);return openOv('limit')}}
  const t=$('#timer');if(t)t.textContent='Connected · '+fmt(Date.now()-S.since);
  save();
},1000);

/* ================= boot ================= */
if(!SC[S.screen])S.screen='splash';
if(S.screen==='splash'){
  history.replaceState({d:0},'','#splash');render();
  later('splash',()=>goRoot('onboard'),2900);
}else if(!allowed(S.screen)){
  S.hist=[];S.screen=fallback();history.replaceState({d:0},'','#'+S.screen);render();
}else{
  S.hist=S.hist.filter(allowed);
  history.replaceState({d:0},'','#'+S.screen);
  for(let i=1;i<=S.hist.length;i++)history.pushState({d:i},'','#'+S.screen);
  render();
}
</script>
</body>
</html>
